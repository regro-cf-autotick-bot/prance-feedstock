{% set name = "prance" %}
{% set version = "26.7.19.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/prance-{{ version }}.tar.gz
  sha256: 18c52bc9ace4de2b58be1d810543d675a8640f06c2ea5d06427f12f1e612be8d

build:
  entry_points:
    - prance=prance.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >65
    - wheel
    - setuptools_scm >8
    # from setuptools_scm[toml]
    - tomli
  run:
    - python >={{ python_min }}
    - chardet >=5.2
    - ruamel.yaml >=0.18.16
    - requests >=2.32.5
    - packaging >=25.0

test:
  imports:
    - prance
  commands:
    - pip check
    - prance --help
    - pip list | grep {{ name }} | tr -s " " | grep {{ version }}
  requires:
    - pip
    # optional dependency needed only for `prance --help`
    - click >=8.3.0
    - flex-swagger
    - python {{ python_min }}

about:
  home: https://github.com/jfinkhaeuser/prance
  summary: Resolving Swagger/OpenAPI 2.0 and 3.0.0 Parser
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - xhochy
    - thewchan
